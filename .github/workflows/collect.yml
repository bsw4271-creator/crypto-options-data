name: 옵션 자료 수집

on:
  schedule:
    # 4시간마다(UTC 00:41, 04:41, …). 정시를 피해 예약 지연을 줄임
    - cron: "41 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: 시험
        run: node --test tests/*.test.mjs
      - name: 수집
        run: node collect.mjs
      - name: 미국 자료 수집
        # 미국 부분이 실패해도 BTC·ETH 자료는 저장한다. 키는 Secrets에서만 읽고 결과·기록에 남기지 않는다.
        continue-on-error: true
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          LEDGER_READ_TOKEN: ${{ secrets.LEDGER_READ_TOKEN }}
        run: node collect-us.mjs
      - name: 저장
        run: |
          git config user.name "options-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "옵션 자료 수집 $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
