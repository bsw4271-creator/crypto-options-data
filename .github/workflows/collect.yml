name: 옵션 자료 수집

on:
  schedule:
    # 4시간마다(UTC 00:41, 04:41, …). 정시를 피해 예약 지연을 줄임
    - cron: "41 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 시험
        run: node --test tests/*.test.mjs
      - name: 수집
        run: node collect.mjs
      - name: 저장
        run: |
          git config user.name "options-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "옵션 자료 수집 $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
